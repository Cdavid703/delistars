user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20M;

  server {
    listen 80;
    server_name _;

    # Headers de seguridad (aplican a todas las respuestas del gateway).
    # HSTS se deja al nginx del host, que es quien termina TLS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API
    location /api/ {
      proxy_pass http://backend:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Domicilios app
    location /domicilios/ {
      proxy_pass http://domicilios:80/domicilios/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Turnos (servido por el mismo contenedor de domicilios)
    location /turnos/ {
      proxy_pass http://domicilios:80/turnos/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vacantes (servido por el mismo contenedor de domicilios)
    location /vacantes/ {
      proxy_pass http://domicilios:80/vacantes/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin panel
    location /admin/ {
      proxy_pass http://admin:80/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Enlaces universales (Fase 6): un mismo enlace sirve en la web y, cuando
    # Android/iPhone tengan sus permisos, abre la app.
    #   /p/<pedido> → seguimiento del pedido · /c/<código> → pedido de caja con código privado
    location ~ "^/p/([A-Za-z0-9_-]{6,40})/?$" {
      absolute_redirect off;
      return 302 /domicilios/?pedido=$1;
    }
    location ~ "^/c/([A-Za-z0-9-]{8,12})/?$" {
      absolute_redirect off;
      return 302 /domicilios/?codigo=$1;
    }

    # Archivos que iPhone y Android leen para abrir la app con esos enlaces
    # (contrato §3.4). appID = Team ID de Apple + bundle; huella = firma de EAS.
    location = /.well-known/apple-app-site-association {
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      return 200 '{"applinks":{"details":[{"appIDs":["3BMCX522KW.com.delistars.app"],"components":[{"/":"/p/*"},{"/":"/c/*"}]}]}}';
    }
    # Dos huellas: la de EAS (instalación directa) y la de la llave de Play
    # (la app que baja de Google Play, firmada por Play desde el 27 oct 2026).
    location = /.well-known/assetlinks.json {
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.delistars.app","sha256_cert_fingerprints":["A1:14:02:FA:DB:7D:D4:55:A8:16:18:A9:E7:D0:16:5A:5E:69:4D:E3:92:AA:C5:BC:EA:69:84:23:08:EA:D5:2F","A1:16:FC:31:CB:9F:A7:98:60:5C:7C:26:45:8A:CB:24:64:F1:F6:8A:9B:A9:69:17:4D:49:7D:6C:0A:51:C7:A7"]}}]';
    }

    # Política de privacidad: página estática propia (no la SPA del menú),
    # en una dirección fija para la web, la app y App Store Connect.
    location = /privacidad {
      proxy_pass http://frontend:80/privacidad.html;
      proxy_set_header Host $host;
    }
    location = /privacidad/ {
      proxy_pass http://frontend:80/privacidad.html;
      proxy_set_header Host $host;
    }

    # Soporte: igual que la privacidad, para las fichas de App Store y Google Play.
    location = /soporte {
      proxy_pass http://frontend:80/soporte.html;
      proxy_set_header Host $host;
    }
    location = /soporte/ {
      proxy_pass http://frontend:80/soporte.html;
      proxy_set_header Host $host;
    }

    # Menú (catch-all)
    location / {
      proxy_pass http://frontend:80/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
