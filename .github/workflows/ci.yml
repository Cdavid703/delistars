# CI: compila las 4 apps y verifica la sincronización de ADMIN_EMAILS en cada
# push. Si algo se rompe, GitHub envía correo — y como el VPS auto-despliega
# integracion-admin, este es el aviso temprano de que el deploy salió mal.
name: CI DeliStars

on:
  push:
    branches: [integracion-admin, main]
  pull_request:

jobs:
  domicilios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:emails
      - run: npm run build
      - run: npm run build:turnos
      - run: npm run build:vacantes

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: delistars-menu-magic/admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: delistars-menu-magic/admin/package-lock.json }
      - run: npm ci
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: delistars-menu-magic/front } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: delistars-menu-magic/front/package-lock.json }
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: delistars-menu-magic/back } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: delistars-menu-magic/back/package-lock.json }
      - run: npm ci
      - run: npm run build --if-present
