# Monitor de disponibilidad: revisa la plataforma cada 10 minutos.
# Si algo no responde, el workflow falla y GitHub envía correo automático
# al dueño del repo (Ajustes → Notifications → Actions).
# NOTA: los workflows con "schedule" solo corren desde la rama por defecto (main).
name: Uptime DeliStars

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar servicios en producción
        run: |
          fallo=0
          for url in \
            "https://delistars.com/" \
            "https://delistars.com/domicilios/" \
            "https://delistars.com/admin/" \
            "https://delistars.com/vacantes/" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "✅ $url → $code"
            else
              echo "❌ $url → $code"
              fallo=1
            fi
          done
          exit $fallo
